server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Ne pas mettre en cache config.json (contient les URLs d'env)
    location = /assets/config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long pour les assets statiques Angular (hachés)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ce qui GARDE SON NOM d'un déploiement à l'autre — traductions, pages
    # HTML — est revalidé à chaque chargement (`no-cache` : un 304 grâce à
    # l'ETag, quasi gratuit). Sans directive, le navigateur appliquait un cache
    # heuristique (~10 % de l'âge du fichier) : le 31/10/2026, après un
    # déploiement, un `fr.json` resté en cache servait le NOUVEAU code avec
    # d'anciennes traductions, et chaque clé ajoutée retombait sur l'anglais
    # (`setFallbackLang('en')`) — « A clearer version of your description »
    # sur un écran en français. Seuls les fichiers à nom haché (bloc
    # précédent) peuvent se garder un an.
    location ^~ /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Landing prérendue (SSG) : HTML statique riche en contenu pour le SEO
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Accueil anglais, prérendu lui aussi.
    location = /en {
        add_header Cache-Control "no-cache";
        try_files /en/index.html =404;
    }

    # Un fichier absent est une ERREUR, pas une page.
    #
    # Le repli SPA renvoyait le shell HTML avec un code 200 pour n'importe quel
    # chemin, `/assets/i18n/de.json` compris : un dictionnaire supprimé
    # continuait donc de « répondre », et un asset manquant après un
    # déploiement raté passait inaperçu. Ces trois répertoires ne contiennent
    # que des fichiers, jamais des routes de l'application.
    location /assets/ { try_files $uri =404; }
    location /media/  { try_files $uri =404; }
    location /fonts/  { try_files $uri =404; }

    # Rapports partagés : jamais dans un moteur de recherche.
    #
    # Le jeton est secret, mais rien n'empêche qu'une URL soit collée sur un
    # forum. L'en-tête double la balise `noindex` posée par l'application : elle
    # s'applique même si le robot ne rend pas le JavaScript, ce qui est le cas
    # de la plupart d'entre eux.
    location ^~ /rapport/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        # On sert la coquille SANS repasser par `location /` : un `try_files`
        # qui renvoie vers un autre bloc perd l'en-tête ajouté ici, puisque
        # `add_header` s'applique au bloc qui répond, pas à celui qui redirige.
        try_files /index.csr.html =404;
    }

    # Slash final : UNE seule URL par page.
    #
    # `/en/` et `/guides/` répondaient 200 au même titre que `/en` et
    # `/guides` — deux URL pour une page, que seule la balise canonique
    # rattrapait. Une 301 vers la forme canonique les réunit vraiment. Elle ne
    # touche pas la racine : le motif exige au moins un caractère avant le
    # slash final.
    #
    # `absolute_redirect off` est indispensable : le conteneur écoute en HTTP
    # derrière le nginx de l'hôte, et une redirection absolue partirait donc
    # vers `http://…`, pour être re-redirigée vers HTTPS — une chaîne de deux
    # sauts, dont un en clair. Une Location relative laisse le navigateur
    # conserver le schéma et l'hôte d'origine.
    absolute_redirect off;

    # L'index des articles s'appelle « blog » depuis le 23/11/2026. Les
    # articles gardent leur adresse (`/guides/…` compris) : seul l'index bouge.
    location = /guides {
        return 301 /blog$is_args$args;
    }

    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # ── Blog : rendu à la demande par le service `blog` (chantier articles-en-base) ──
    #
    # Les articles vivent en base et changent sans déploiement : ces adresses ne sont
    # plus des fichiers prérendus, nginx les relaie au service Node (image
    # `namorama-blog`). Tout le reste du site est servi ici, comme avant.
    #
    # Des `location` REGEX, placées APRÈS celle du slash final : une regex l'emporte
    # dans l'ordre du fichier, `/blog/` reçoit donc toujours sa 301. Un préfixe `^~`
    # aurait court-circuité cette règle.
    #
    # `proxy_pass` par une VARIABLE, résolue par le DNS de Docker à la requête : un
    # nom littéral (`http://blog:4000`) fait échouer le démarrage de nginx — donc de
    # TOUT le site — si le conteneur `blog` est absent.
    #
    # `Host` fixe : le service n'accepte que les hôtes de `security.allowedHosts`
    # (angular.json) et, hors liste, rend la coquille vide — une page sans contenu,
    # sans erreur visible. Le domaine canonique est le seul qu'il doive voir.
    #
    # En-têtes `X-Forwarded-*` et `Forwarded` RETIRÉS : Angular 21 refuse de rendre
    # une requête qui en porte sans `trustProxyHeaders`, et sert alors la coquille
    # vide, en 200. Le nginx de l'hôte les pose sur chaque requête : relayés tels
    # quels, toutes les pages du blog partaient vides aux robots (constaté au test
    # des conteneurs, 23/11/2026). Le service n'a pas besoin de l'adresse du client.
    #
    # La liste des adresses historiques doit rester celle de CHEMINS_HISTORIQUES
    # (web/src/app/components/content/chemins-historiques.ts) : `chemins-du-site.spec.ts`
    # le vérifie.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $service_blog http://blog:4000;

    location = /sitemap.xml {
        proxy_pass $service_blog;
        proxy_set_header Host namorama.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        error_page 502 504 = @blog_indisponible;
    }

    location ~ ^/(blog|blog/[a-z0-9-]+|guides/[a-z0-9-]+)$ {
        proxy_pass $service_blog;
        proxy_set_header Host namorama.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        error_page 502 504 = @blog_indisponible;
    }

    # Adresses historiques des articles (antérieures au blog) — CHEMINS_HISTORIQUES.
    location ~ ^/(comparatif-generateurs-de-noms|generateur-nom-de-domaine|generateur-nom-de-marque|generateur-nom-de-produit|generateur-nom-ecommerce|generateur-nom-entreprise|generateur-nom-marque-cosmetique|generateur-nom-marque-vetement|generateur-nom-saas|generateur-nom-startup-ia|namorama-vs-looka|namorama-vs-namelix|nom-de-startup-court-invente|recherche-anteriorite-marque-inpi)$ {
        proxy_pass $service_blog;
        proxy_set_header Host namorama.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        error_page 502 504 = @blog_indisponible;
    }

    # Service du blog injoignable : 503 et non 502, avec `Retry-After`. Un robot qui
    # lit 502 ou 404 peut retirer la page de l'index ; un 503 lui dit de revenir.
    location @blog_indisponible {
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "Blog momentanément indisponible.\n";
    }

    # Routes : on sert d'abord le fichier exact, puis l'éventuel index.html
    # prérendu de la route (pages de contenu SSG comme /guides/...), à l'URL
    # canonique sans slash final et sans redirection. À défaut, on retombe sur
    # le shell client (index.csr.html) pour les routes purement SPA (wizard,
    # admin, paiement…), sans afficher la landing prérendue au préalable.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }
}
