server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Ne pas mettre en cache config.json (contient les URLs d'env)
    location = /assets/config.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long pour les assets statiques Angular (hachés)
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ce qui GARDE SON NOM d'un déploiement à l'autre — traductions, pages
    # HTML — est revalidé à chaque chargement (`no-cache` : un 304 grâce à
    # l'ETag, quasi gratuit). Sans directive, le navigateur appliquait un cache
    # heuristique (~10 % de l'âge du fichier) : le 31/10/2026, après un
    # déploiement, un `fr.json` resté en cache servait le NOUVEAU code avec
    # d'anciennes traductions, et chaque clé ajoutée retombait sur l'anglais
    # (`setFallbackLang('en')`) — « A clearer version of your description »
    # sur un écran en français. Seuls les fichiers à nom haché (bloc
    # précédent) peuvent se garder un an.
    location ^~ /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Landing prérendue (SSG) : HTML statique riche en contenu pour le SEO
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Accueil anglais, prérendu lui aussi.
    location = /en {
        add_header Cache-Control "no-cache";
        try_files /en/index.html =404;
    }

    # Un fichier absent est une ERREUR, pas une page.
    #
    # Le repli SPA renvoyait le shell HTML avec un code 200 pour n'importe quel
    # chemin, `/assets/i18n/de.json` compris : un dictionnaire supprimé
    # continuait donc de « répondre », et un asset manquant après un
    # déploiement raté passait inaperçu. Ces trois répertoires ne contiennent
    # que des fichiers, jamais des routes de l'application.
    location /assets/ { try_files $uri =404; }
    location /media/  { try_files $uri =404; }
    location /fonts/  { try_files $uri =404; }

    # Rapports partagés : jamais dans un moteur de recherche.
    #
    # Le jeton est secret, mais rien n'empêche qu'une URL soit collée sur un
    # forum. L'en-tête double la balise `noindex` posée par l'application : elle
    # s'applique même si le robot ne rend pas le JavaScript, ce qui est le cas
    # de la plupart d'entre eux.
    location ^~ /rapport/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        # On sert la coquille SANS repasser par `location /` : un `try_files`
        # qui renvoie vers un autre bloc perd l'en-tête ajouté ici, puisque
        # `add_header` s'applique au bloc qui répond, pas à celui qui redirige.
        try_files /index.csr.html =404;
    }

    # Slash final : UNE seule URL par page.
    #
    # `/en/` et `/guides/` répondaient 200 au même titre que `/en` et
    # `/guides` — deux URL pour une page, que seule la balise canonique
    # rattrapait. Une 301 vers la forme canonique les réunit vraiment. Elle ne
    # touche pas la racine : le motif exige au moins un caractère avant le
    # slash final.
    #
    # `absolute_redirect off` est indispensable : le conteneur écoute en HTTP
    # derrière le nginx de l'hôte, et une redirection absolue partirait donc
    # vers `http://…`, pour être re-redirigée vers HTTPS — une chaîne de deux
    # sauts, dont un en clair. Une Location relative laisse le navigateur
    # conserver le schéma et l'hôte d'origine.
    absolute_redirect off;

    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Routes : on sert d'abord le fichier exact, puis l'éventuel index.html
    # prérendu de la route (pages de contenu SSG comme /guides/...), à l'URL
    # canonique sans slash final et sans redirection. À défaut, on retombe sur
    # le shell client (index.csr.html) pour les routes purement SPA (wizard,
    # admin, paiement…), sans afficher la landing prérendue au préalable.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.csr.html;
    }
}
