<!doctype html>
<html lang="fr">
<head>
  <!--
    Thème : script SYNCHRONE, avant tout style. Aucun framework ne peut le
    faire assez tôt, Angular compris : si le mode est lu après le rendu, un
    utilisateur en préférence sombre voit un éclair blanc à chaque navigation.

    Trois valeurs stockées, pas deux : « light », « dark », ou RIEN. « Système »
    est l'absence de valeur — enregistrer le mode résolu ferait cesser le suivi
    de l'OS sans que l'utilisateur l'ait demandé.
  -->
  <script>
    (function () {
      var m = null;
      try { m = localStorage.getItem('nm-theme'); } catch (e) { /* stockage bloqué */ }
      // L'attribut porte toujours le mode RÉSOLU (deux valeurs), le stockage
      // le CHOIX (trois états, « système » = rien). PrimeNG ne sait basculer
      // que sur un sélecteur : sans attribut en mode système + OS sombre, ses
      // composants resteraient clairs au milieu d'une interface sombre.
      if (m !== 'light' && m !== 'dark') {
        m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', m);
    })();
  </script>

  <meta charset="utf-8">

  <!-- Données structurées de la FAQ : posées par le composant d'accueil (voir
       landing.ts), pas ici. Écrites dans ce fichier, elles partaient dans les
       dix-neuf pages prérendues, dont des guides sans FAQ visible. -->

  <!--
    Chemins ABSOLUS, et pas seulement relatifs à `<base href="/">`.

    Les pages prérendues vivent à des profondeurs différentes (`/guides/xxx`),
    et tous les agents ne lisent pas `<base>` : GPTBot résout « favicon.svg »
    contre le répertoire de la page et demande donc
    `/guides/favicon.svg` — 404. Une barre oblique tranche pour tout le monde.
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Google tag (gtag.js) + Consent Mode v2 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0PRN6V9ZL7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Refus par défaut jusqu'au consentement explicite (RGPD)
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'wait_for_update': 500
    });
    gtag('config', 'G-0PRN6V9ZL7');
  </script>
</head>
<body>
  <app-root></app-root>
  <!--
    Langue déclarée par la coquille cliente (/app, /projects/…), AVANT que
    l'application ne démarre (chantier `declarer-la-langue-affichee`).

    Sans lui, la page restait en `lang="fr"` jusqu'à la fin du démarrage, qui
    attend Keycloak et le dictionnaire : un navigateur anglais proposait de
    « traduire du français » une interface anglaise, et son traducteur
    réécrivait les libellés (« E.g. » → « Eg »).

    Placé APRÈS <app-root>, et non dans <head> : il doit savoir si la page est
    prérendue (`ng-server-context`). Une page prérendue garde la langue posée
    au rendu — la landing française reste `fr` pour un navigateur anglais.

    Même règle que `langueInitiale()` (app.config.ts), en ES5 : URL, puis
    navigateur si servi, puis anglais. `langue-initiale.spec.ts` exécute ce
    script et le compare à la fonction — l'un ne change pas sans l'autre.
  -->
  <script id="nm-langue">
    (function () {
      var racine = document.querySelector('app-root');
      if (!racine || racine.hasAttribute('ng-server-context')) return;
      var servies = ['fr', 'en'];
      var segment = location.pathname.split('/').filter(Boolean)[0];
      var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      nav = nav.split('-')[0].split('_')[0];
      document.documentElement.lang =
        servies.indexOf(segment) >= 0 ? segment : servies.indexOf(nav) >= 0 ? nav : 'en';
    })();
  </script>
</body>
</html>
