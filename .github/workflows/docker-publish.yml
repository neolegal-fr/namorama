name: Build and Push Docker Images

# Sur `main` : build puis push au registry, c'est ce que la prod tire.
# Chaque image est publiée sous deux tags, `latest` et le SHA du commit. Avec
# `latest` seul, revenir à la version précédente imposait de rebuilder : il n'y
# avait plus rien à tirer. Le tag par SHA rend le rollback possible.
# Sur une PR : build seul, sans push ni login. Une PR non testée oblige à
# découvrir la casse une fois sur `main`, image déjà publiée — et les PRs
# Dependabot n'ont de toute façon pas accès aux secrets du dépôt.
#
# Les tests de l'API tournent avant les deux builds, qui en dépendent : une
# suite rouge doit empêcher la publication de l'image, pas être constatée
# après coup. Le job compile aussi les types (`tsc --noEmit`), car `nest build`
# dans le Dockerfile ne signalerait la casse qu'au moment du build d'image —
# et c'est précisément ce qui avait laissé passer une montée de TypeORM.
#
# Pas de job de tests pour le web : il n'a aucun test, et `ng test` échoue
# s'il n'en trouve aucun. À ajouter le jour où une première spec existe.
#
# Le web a en revanche le contrôle du système de design (`design-web`) : un
# cliquet qui refuse toute couleur, style en ligne, taille en px ou
# `!important` ajouté hors des fichiers de jetons. Sans dépendance, il tourne
# sans `npm ci`, et l'image web en dépend. Voir docs/systeme-de-design.md §1.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: git.neolegal.fr
  IMAGE_PREFIX: git.neolegal.fr/neolegal/namorama

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Mêmes drapeaux que `api/Dockerfile`, pour tester ce qui est réellement
      # livré. `--legacy-peer-deps` : nest-keycloak-connect exige
      # `@nestjs/common <11` alors que le projet est en 11.x, et sans lui
      # `npm ci` refuse d'installer. `--omit=optional` : écarte le
      # `chromedriver` optionnel de keycloak-connect, que rien n'importe et
      # dont le script d'installation télécharge un binaire de navigateur.
      - name: Install dependencies
        working-directory: ./api
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Typecheck
        working-directory: ./api
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Run tests
        working-directory: ./api
        run: npm test

  build-api:
    name: Build API image
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Gitea registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

  design-web:
    name: Système de design (web)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Aucune valeur en dur ajoutée
        run: node web/scripts/verifier-design.mjs

  build-web:
    name: Build Web image
    needs: [test-api, design-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Gitea registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
